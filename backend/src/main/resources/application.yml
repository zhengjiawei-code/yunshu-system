server:
  # yunshu 专用端口：避开 luohuo（前端 5173 / 后端 8000）
  port: 8090
  # 同时监听 IPv4/IPv6，避免只监听 IPv6 导致 127.0.0.1 无法访问
  address: 0.0.0.0

spring:
  application:
    name: yunshu-backend
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        # 读走 slave，写与事务走 master；初期两者指向同一个库，后续改配置即可切分
        master:
          url: ${YUNSHU_DB_URL:jdbc:mysql://127.0.0.1:3306/yunshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
          username: ${YUNSHU_DB_USER:root}
          password: ${YUNSHU_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
        slave:
          url: ${YUNSHU_DB_URL:jdbc:mysql://127.0.0.1:3306/yunshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
          username: ${YUNSHU_DB_USER:root}
          password: ${YUNSHU_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 全国四级区划 JSON 约 3-4MB，导入/预检需放行；避免调大后无上限
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    # 独立数据源，避免动态数据源路由影响迁移执行
    url: ${YUNSHU_DB_URL:jdbc:mysql://127.0.0.1:3306/yunshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    user: ${YUNSHU_DB_USER:root}
    password: ${YUNSHU_DB_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 数据权限过滤开关：2026-11-21 家伟裁定采用黑名单式（默认全表过滤、平台表豁免），已启用
# 规则与豁免清单见 2026-11-21/data-permission/outputs/data-permission-spec.md
yunshu:
  data-scope:
    enabled: true
  # 区划数据：离线 JSON 导入为主；在线同步默认关闭，无外网时页面会明确提示改用离线导入
  region:
    online-sync-enabled: false
    online-data-url: https://raw.githubusercontent.com/modood/Administrative-divisions-of-China/master/dist/pca-code.json

logging:
  level:
    com.yunshu: info
